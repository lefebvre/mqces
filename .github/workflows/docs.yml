name: docs

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

# One in-flight Pages deploy at a time; PR builds don't deploy at all.
concurrency:
    group: pages
    cancel-in-progress: false

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        name: Build docs
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4

            - name: Install Doxygen
              run: |
                sudo apt-get update
                sudo apt-get install -y doxygen graphviz

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'
                cache-dependency-path: docs/requirements.txt

            - name: Install Sphinx + extensions
              run: pip install -r docs/requirements.txt

            - name: Run Doxygen
              # Render Doxyfile.in via envsubst so PR builds don't need a
              # CMake configure step. Uses the same variable names as the
              # CMake `configure_file()` path.
              run: |
                mkdir -p docs/_build/doxygen
                export MQCES_VERSION
                export MQCES_DOXYGEN_INPUT_DIR="${PWD}/mqces"
                export MQCES_DOXYGEN_OUTPUT_DIR="${PWD}/docs/_build/doxygen"
                MQCES_VERSION=$(awk '/^[[:space:]]*VERSION[[:space:]]/ {print $2; exit}' CMakeLists.txt)
                envsubst < docs/Doxyfile.in > docs/_build/Doxyfile
                doxygen docs/_build/Doxyfile

            - name: Run Sphinx
              env:
                MQCES_DOXYGEN_XML_DIR: ${{ github.workspace }}/docs/_build/doxygen/xml
              run: sphinx-build -W --keep-going -b html docs docs/_build/html

            - name: Link check (warning only)
              env:
                MQCES_DOXYGEN_XML_DIR: ${{ github.workspace }}/docs/_build/doxygen/xml
              run: sphinx-build -b linkcheck docs docs/_build/linkcheck || true

            - name: Upload Pages artifact
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: actions/upload-pages-artifact@v3
              with:
                path: docs/_build/html

            - name: Upload PR preview artifact
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                name: docs-preview-${{ github.event.pull_request.number }}
                path: docs/_build/html
                retention-days: 14

    deploy:
        name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        needs: build
        runs-on: ubuntu-22.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
