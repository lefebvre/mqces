name: ci

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-test:
        name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-22.04, macos-14]
                compiler: [gcc, clang]
                build_type: [Debug, Release]
                exclude:
                    - os: macos-14
                      compiler: gcc
                include:
                    - os: windows-2022
                      compiler: msvc
                      build_type: Debug
                    - os: windows-2022
                      compiler: msvc
                      build_type: Release

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v4

            - name: Install Windows toolchain
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1

            - name: Install Ninja (Windows)
              if: runner.os == 'Windows'
              run: choco install ninja --no-progress -y

            - name: Install Linux toolchain
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get install -y ninja-build ccache libomp-dev python3-dev
                if [ "${{ matrix.compiler }}" = "clang" ]; then
                    sudo apt-get install -y clang
                    echo "CC=clang"  >> "$GITHUB_ENV"
                    echo "CXX=clang++" >> "$GITHUB_ENV"
                else
                    echo "CC=gcc"  >> "$GITHUB_ENV"
                    echo "CXX=g++" >> "$GITHUB_ENV"
                fi

            - name: Install macOS toolchain
              if: runner.os == 'macOS'
              run: |
                brew install ninja ccache libomp
                echo "CC=clang"  >> "$GITHUB_ENV"
                echo "CXX=clang++" >> "$GITHUB_ENV"

            - name: ccache
              if: runner.os != 'Windows'
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}

            - name: Configure
              run: |
                launcher=()
                if [ "$RUNNER_OS" != "Windows" ]; then
                    launcher=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
                fi
                cmake -B build -G Ninja \
                    -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                    "${launcher[@]}" \
                    -DMQCES_ENABLE_TESTS=ON \
                    -DMQCES_ENABLE_CLI=ON \
                    -DMQCES_WERROR=ON

            - name: Build
              run: cmake --build build -j

            # --no-tests=error: a test binary that fails to build or register
            # must not shrink the suite silently.
            - name: Test
              run: ctest --test-dir build --output-on-failure --no-tests=error --label-regex 'unit|integration'

    python:
        name: python bindings (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-22.04]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install toolchain
              run: |
                sudo apt-get update
                sudo apt-get install -y ninja-build libomp-dev

            # Installs through scikit-build-core exactly as a user would, so a
            # missing install rule for the extension module fails here.
            - name: Install package
              run: python -m pip install ".[test]"

            # Run from outside the source tree so `import mqces` resolves to
            # the installed package, not python/mqces.
            - name: Test
              working-directory: ${{ runner.temp }}
              run: python -m pytest "${{ github.workspace }}/python/tests"
