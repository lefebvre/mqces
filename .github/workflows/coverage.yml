name: coverage

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    coverage:
        runs-on: ubuntu-22.04
        # Well above the ~30 minutes the job takes, but low enough that a
        # blow-up fails quickly instead of burning the 6-hour default.
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4
            - name: Install toolchain
              run: |
                sudo apt-get update
                sudo apt-get install -y ninja-build ccache g++ gcovr libomp-dev python3-dev
                echo "CC=gcc"  >> "$GITHUB_ENV"
                echo "CXX=g++" >> "$GITHUB_ENV"

            - uses: hendrikmuhs/ccache-action@v1.2
              with: { key: coverage }

            - name: Configure
              run: cmake --preset coverage -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

            - name: Build
              run: cmake --build --preset coverage -j

            # Unoptimized and gcov-instrumented, this build runs roughly four
            # orders of magnitude slower than Release, and the statistical
            # tests repeat whole classifications hundreds of times: the burnup
            # sweep alone took 2.8 hours and the job hit the 6-hour limit.
            # Those tests are excluded here; they still run in every other
            # job. They repeat whole classifications for statistical power
            # rather than reaching new code, and the remaining 72 tests still
            # cover 91% of library lines and every function. Tests run in
            # parallel; each still uses OpenMP internally, so the job is not
            # four times faster.
            - name: Test
              run: |
                ctest --preset coverage -j 4 --label-regex 'unit|integration'                     --exclude-regex 'Calibrated|NOTA\.(FalsePositiveRateMatchesThreshold|DetectsShiftedDistribution)|BurnupPipeline\.(ClassifiesGenuineSamplesToTheirTrueClass|WithheldTrueClassIsFlagged)'

            - name: Generate coverage report
              run: |
                gcovr -r . --filter '^mqces/' \
                    --exclude-throw-branches \
                    --exclude 'mqces/.*\.hpp\.in$' \
                    --exclude tests/ \
                    --exclude benchmarks/ \
                    --xml coverage.xml \
                    --html-details coverage.html \
                    --print-summary

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: |
                      coverage.xml
                      coverage*.html
                      coverage.css

            - name: Upload to Codecov
              if: ${{ env.CODECOV_TOKEN != '' }}
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              uses: codecov/codecov-action@v5
              with:
                  files: coverage.xml
                  fail_ci_if_error: false
