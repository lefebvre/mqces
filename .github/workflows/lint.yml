name: lint

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    clang-format:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            # Ubuntu 22.04's archive has no clang-format-19; the PyPI wheel
            # pins the same version as the pre-commit hook.
            - name: Install clang-format
              run: python3 -m pip install "clang-format==19.1.7"

            - name: Check formatting
              run: |
                # Format every C/C++ source in the project, exclude generated
                # fixture files and build/ trees. The hook reports a diff on
                # any deviation and fails the job.
                files=$(git ls-files \
                    '*.cpp' '*.hpp' '*.h' '*.c' \
                    ':!tests/data/fixtures_data.*' \
                    ':!tests/data/expected_scores.*')
                if [ -z "$files" ]; then
                    echo "no files to check"; exit 0
                fi
                clang-format --dry-run --Werror $files

    clang-tidy:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: Install toolchain
              run: |
                sudo apt-get update
                sudo apt-get install -y ninja-build clang clang-tidy libomp-dev python3-dev

            - name: Configure (tidy preset, run via compile_commands.json)
              run: cmake --preset tidy

            - name: Run clang-tidy on library and CLI sources
              run: |
                # Limited to the library and the CLI; tests don't ride the
                # production bar. run-clang-tidy matches these regexes
                # against absolute paths, so they are anchored at the
                # workspace root: an unanchored 'mqces/' also matches the
                # checkout directory itself (.../mqces/mqces/tests/...).
                # Project headers are covered through HeaderFilterRegex.
                root="${GITHUB_WORKSPACE}"
                run-clang-tidy -p build/tidy -j "$(nproc)" \
                    "^${root}/mqces/[^/]+\.cpp$" \
                    "^${root}/mqces_apps/[^/]+\.cpp$"
