name: lint

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    clang-format:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: Install clang-format
              run: |
                sudo apt-get update
                sudo apt-get install -y clang-format-19
                sudo ln -sf /usr/bin/clang-format-19 /usr/local/bin/clang-format

            - name: Check formatting
              run: |
                # Format every C/C++ source in the project, exclude generated
                # fixture files and build/ trees. The hook reports a diff on
                # any deviation and fails the job.
                files=$(git ls-files \
                    '*.cpp' '*.hpp' '*.h' '*.c' \
                    ':!tests/data/fixtures_data.*' \
                    ':!tests/data/expected_scores.*')
                if [ -z "$files" ]; then
                    echo "no files to check"; exit 0
                fi
                clang-format --dry-run --Werror $files

    clang-tidy:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: Install toolchain
              run: |
                sudo apt-get update
                sudo apt-get install -y ninja-build clang clang-tidy libomp-dev python3-dev

            - name: Configure (tidy preset, run via compile_commands.json)
              run: cmake --preset tidy

            - name: Run clang-tidy on changed sources
              run: |
                # Limit to library + apps + bindings; tests don't ride the
                # production warning bar. The tidy preset wires
                # MQCES_ENABLE_CLANG_TIDY=ON so the build itself surfaces
                # diagnostics; this step also runs run-clang-tidy as a
                # belt-and-braces check.
                run-clang-tidy -p build/tidy -j $(nproc) \
                    'mqces/.*\.(cpp|hpp)$' 'mqces_apps/.*\.cpp$' \
                    || exit 1
